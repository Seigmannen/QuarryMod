plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"quarrymod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Fast navn på testklienten, så den er operatør på testserveren (offline-UUID, online-mode=false).
			programArgs "--username", "Moltemyhr"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mine (Almost) Everything (valgfri, se compat/MineEverythingCompat). Jar-filen ligger i libs/, så prosjektet bygger overalt.
	// compileOnly: bare for å kompilere mot API-et. Kommer ikke med i jar-filen eller publiseringen (ingen include).
	compileOnly files("libs/mineeverything-1.2.0.jar")
	// localRuntime: bare med i runClient/runServer i dev. Kjør uten den med: gradlew runClient -PnoMineEverything
	if (!project.hasProperty("noMineEverything")) {
		localRuntime files("libs/mineeverything-1.2.0.jar")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
